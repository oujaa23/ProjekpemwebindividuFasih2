<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuangNada</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <a href="#" class="logo" data-page="beranda">
        <span class="logo-icon">♪</span>
        Ruang<b>Nada</b>
    </a>

    <nav aria-label="Navigasi utama">
        <button class="nav-btn active" data-page="beranda">
            Beranda
        </button>

        <button class="nav-btn" data-page="playlist">
            Playlist
        </button>

        <button class="nav-btn" data-page="fokus">
            Ruang Fokus
        </button>
    </nav>

</header>


<main>


    <!-- BERANDA -->
    <section id="beranda" class="page active">

        <article class="hero">

            <div>

                <p class="eyebrow">
                    PLAYLIST UNTUK BELAJAR
                </p>

                <h1>
                    Temukan nada yang bikin
                    <span>fokus</span> tahan lama.
                </h1>

                <p class="description">
                    Pilih suasana, putar musik,
                    nyalakan timer Pomodoro,
                    dan selesaikan tugasmu tanpa distraksi.
                </p>

                <div class="button-row">

                    <button
                        class="btn primary"
                        data-page="fokus">
                        Mulai Belajar
                    </button>

                    <button
                        class="btn"
                        id="btnAcak">
                        Putar Acak
                    </button>

                </div>

            </div>


            <aside class="now-card">

                <p class="eyebrow">
                    SEDANG DIPUTAR
                </p>

                <div
                    class="cover big"
                    id="homeCover">
                    ♪
                </div>

                <h2 id="homeTitle">
                    Belum ada lagu
                </h2>

                <p
                    class="muted"
                    id="homeArtist">
                    Pilih lagu untuk memulai
                </p>

            </aside>

        </article>


        <section>

            <h2>
                Ringkasan Belajarmu
            </h2>

            <div
                class="stats"
                id="stats">
            </div>

        </section>


        <section>

            <h2>
                Pilih Genre
            </h2>

            <div
                class="moods"
                id="moods">
            </div>

        </section>

    </section>
